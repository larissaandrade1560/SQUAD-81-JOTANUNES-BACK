databases:
  - name: jotanunes-postgres
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  - type: web
    name: jotanunes-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: Database__ApplyMigrations
        value: "true"
      - key: ConnectionStrings__JotaNunesFormsDb
        fromDatabase:
          name: jotanunes-postgres
          property: connectionString
      - key: Cors__Origins
        sync: false
      - key: Jwt__Issuer
        value: JotaNunesForms
      - key: Jwt__Audience
        value: JotaNunesForms
      - key: Jwt__SigningKey
        sync: false
      - key: Jwt__ExpirationMinutes
        value: "480"
      - key: BootstrapAdmin__Enabled
        value: "false"
      - key: BootstrapAdmin__Documento
        sync: false
      - key: BootstrapAdmin__NomeExibicao
        sync: false
      - key: BootstrapAdmin__Password
        sync: false
