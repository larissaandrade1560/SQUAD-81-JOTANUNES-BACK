services:
  api:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace
    ports:
      - "8080:8080"
    environment:
      ConnectionStrings__JotaNunesFormsDb: "Server=sqlserver,1433;Database=JotaNunesFormsDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True"
    command: dotnet watch run --urls http://0.0.0.0:8080
    depends_on:
      - sqlserver

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

  frontend:
    image: node:22-alpine
    working_dir: /workspace/frontend
    volumes:
      - ./:/workspace
      - frontend-node-modules:/workspace/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8080"
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - api

volumes:
  sqlserver-data:
  frontend-node-modules: