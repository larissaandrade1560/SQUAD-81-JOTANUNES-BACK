services:
  api:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    working_dir: /workspace/backend
    volumes:
      - ./:/workspace
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__ApplyMigrations: "true"
      ConnectionStrings__JotaNunesFormsDb: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
    command: dotnet watch run --project src/JotaNunesForms.Api --urls http://0.0.0.0:8080
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: node:22-alpine
    working_dir: /workspace/frontend
    volumes:
      - ./:/workspace
      - frontend-node-modules:/workspace/frontend/node_modules
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: "http://localhost:8080"
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - api

volumes:
  postgres-data:
  frontend-node-modules:
